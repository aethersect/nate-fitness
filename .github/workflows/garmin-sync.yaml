name: Sync Garmin bio data

on:
  schedule:
    # 23:30 UTC = 07:30 SGT (avant la journée), 12:30 UTC = 20:30 SGT (après le sport)
    - cron: "30 23 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch: {}   # bouton "Run workflow" dans l'onglet Actions, pour tester à la main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install garminconnect

      - name: Run sync
        env:
          GARMIN_TOKENS_B64: ${{ secrets.GARMIN_TOKENS_B64 }}
        run: python garmin_sync.py

      - name: Commit updated data
        run: |
          git config user.name "garmin-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/garmin-data.json
          git diff --staged --quiet || git commit -m "Sync Garmin bio data"
          git push
